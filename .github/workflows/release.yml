name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build Release Binaries
        run: |
          mkdir -p dist
          TAG_NAME=${GITHUB_REF#refs/tags/}
          
          # Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/hnw ./cmd/hnw
          tar -czf "dist/hnw_${TAG_NAME}_linux_amd64.tar.gz" -C dist hnw
          rm dist/hnw

          # Linux arm64
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/hnw ./cmd/hnw
          tar -czf "dist/hnw_${TAG_NAME}_linux_arm64.tar.gz" -C dist hnw
          rm dist/hnw

          # Checksums
          cd dist
          sha256sum hnw_*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
